# device.conf — Pixel 3a XL (bonito). Read by every forge script. See forge/device.conf.example.

# ---- identity ----
DEVICE=google/bonito
DEVICE_CODENAME=bonito
DEVICE_SLUG=bonito
VENDOR=google
SOC=sdm670  # Pixel 3a XL; sargo (3a) shares this tree — switch the 4 identity lines to build it; gates options that only suit some hardware

# ---- base ----
BRANCH=lineage-24.0
BASE_REF=m/lineage-24.0
# Android 14+ lunch combos are <product>-<release>-<variant>. vendor/lineage defines exactly one
# release config per branch (vars/aosp_target_release): bp1a on 22.2, bp4a on 23.2, cp2a on 24.0.
# -user, not -userdebug: a userdebug build leaves adbd running from first boot, so a freshly
# flashed phone prompts to authorise the computer before anyone has opened Developer options.
# Nothing in this tree enables it -- it is inherent to the build type. ro.adb.secure stays 1 either
# way, so it was never open, but a release image should not ship with adb live. -user disables adbd
# until Developer options is deliberately turned on. Use -userdebug when bringing a device up.
LUNCH_TARGET=lineage_bonito-cp2a-user
MANIFEST_URL=https://github.com/LineageOS/android.git

# ---- build environment (Android 15 needs 24.04 + JDK 21) ----
UBUNTU_VER=24.04
JDK_VER=21

# ---- projects that carry patches under overlay/patches/ (everything else is an option) ----
PATCHED_PROJECTS="device/google/bonito external/tinyxml2 frameworks/base frameworks/hardware/interfaces hardware/google/pixel hardware/interfaces hardware/qcom/sdm845/display system/bpf system/memory/libmeminfo"   # bonito: 24.0 port; pixel: restore the drv2624 vibrator HAL; base: cap the SystemServiceRegistry wtf loop; bpf: loader fixes for 4.9; hi: health uevent filter needs a 5.3 verifier; libmeminfo: gpu map may be absent; tinyxml2: 11.0.0 overruns CamX stack; fhi: restore stats@1.0 for the fpc blob; display: drop hardware.google.light HBM

# ---- extra kernel config fragments (rom-forge/kernel-configs/<name>.config) ----
# bpf-events: without CONFIG_BPF_EVENTS the tracing BPF program types are not registered, so
# every .bpf object under /system/etc/bpf fails to load with a bare EINVAL and no verifier log.
KERNEL_EXTRA_CONFIGS="bpf-events"

# ---- GApps ----
# CORRECTED 2026-09-04: an earlier note here claimed GApps could not fit on this device. That was
# wrong. BoardConfigLineage.mk sets BOARD_PRODUCTIMAGE_PARTITION_RESERVED_SIZE := 1000 MiB — space
# LineageOS reserves inside /product so users can flash GApps AFTER install. check_partition_sizes
# counts that reservation against BOARD_SUPER_PARTITION_SIZE, so the "38 MiB of headroom" measured
# earlier was already AFTER setting a gigabyte aside for GApps.
#
# Verified against a real bonito running official LineageOS 22.2 + full GApps: /product sized
# 1.6G, 1.2G used (Velvet 264 + GmsCore 161 + Phonesky 76 + TTS + talkback), 330M still free.
#
# Because a `full` build BAKES GApps in, the post-flash reservation is not needed — the device
# patch shrinks it when WITH_GAPPS=true. That is what lets Firefox AND GApps coexist here.
# GAPPS_URL. Note what this is and is NOT: the gapps option gets GMS Core and the Play Store from
# vendor/gapps, MindTheGapps built FROM SOURCE via the option's own local manifest (revision
# cinnamonbun = Android 17), and that needs nothing set here. GAPPS_URL feeds a separate step,
# forge/tools/extract-gapps-apps.sh, which swaps seven stock apps for Google's builds of them
# (Calculator, Calendar, Clock, Contacts, Files, Messages, Phone). Velvet is not among them and is
# dropped outright by the option's own patch, so the Google app and Assistant do not ship either way.
#
# It has to be set because bootstrap.sh otherwise picks a NikGapps URL from the Android version
# (derived as 17 from lineage-24.0) and NikGapps has no Android 17 build -- latest is 16. It fails
# the build rather than guessing, which is what we want: GApps are version-specific and a mismatch
# is SILENT, the apps install and are simply built for another platform.
#
# WITH_GAPPS_EXTRAS=false is set below, which is the supported way to say "MindTheGapps only":
# Play Store and GMS from the manifest repo, none of the seven swaps. It skips the download, the
# extractor and the check in one switch, and it exists for exactly this case -- NikGapps has no
# Android 17 build. GAPPS_URL therefore feeds nothing right now; it is kept so that pointing it at
# a NikGapps 17 package and flipping WITH_GAPPS_EXTRAS back to true is a two-line change.
#
# Do not "fix" this by loosening extract-gapps-apps.sh instead. Tried 2026-09-22: the extractor and
# options/gapps/require.sh both guard the same thing, so weakening one leaves them disagreeing --
# the extractor passes and require.sh still refuses. The switch turns both off together.
# Room: see the reservation note above -- WITH_GAPPS drops the /product reservation from 512 MiB to
# 32, which is what makes a 522 MiB package fit at all.
# Verified 2026-09-22: release MindTheGapps-17.0.0-arm64-20260915_222140, 522 MiB, sha256 published
# beside it.
GAPPS_URL="https://github.com/MindTheGapps/17.0.0-arm64/releases/download/MindTheGapps-17.0.0-arm64-20260915_222140/MindTheGapps-17.0.0-arm64-20260915_222140.zip"

# MindTheGapps only: GMS Core and the Play Store, Lineage's own Calculator/Calendar/Clock/
# Contacts/Files/Messages/Phone. NikGapps has no Android 17 package to swap them from.
WITH_GAPPS_EXTRAS=false

# This kernel is 4.9 and has no CONFIG_EROFS_FS. Android 15+ builds APEX payloads as EROFS, so a
# prebuilt apex in that format cannot be mounted: apexd fails with "No such device", the apex never
# activates, and everything inside it is absent at runtime with no other symptom. MindTheGapps ships
# GmsCore ONLY inside com.google.android.gmssystem.prodvic.apex, so Play Services simply did not
# exist and SetupWizard hung on "Just a sec" forever (2026-09-23).
#
# This repacks such an apex with an ext4 payload at build time and re-signs it from KEYS_DIR. Only
# PREBUILT apexes are affected -- the 90 apexes this tree builds itself are already ext4 and mount
# fine. Needs KEYS_DIR set and a key made once on the host:
#   forge/tools/make-apex-key.sh com.google.android.gmssystem "$KEYS_DIR"
APEX_EROFS_UNSUPPORTED=true

# ---- build presets: a named set of options, plus the build tag ----
# One build command produces one image. Option names come from forge/options/ -- a name with no
# directory there is an error, not a silently ignored word.
# Options every PRESET on this device gets. Keeps the preset rows to what actually differs between
# them. Note this applies to presets only: an ad-hoc OPTIONS="..." replaces the list rather than
# adding to it, so that set is the whole set. No option has lineage-24.0 patches in the forge yet;
# the ones that carry patches stop the build at the option check until they do.
# nav-icons is device-wide: the artwork is ours, redrawn from scratch as vectors, so it is part of the
# look on every device rather than an addition to opt into.
COMMON_OPTIONS="advanced-restart dark-default google-feed-off home-defaults linux livedisplay-off minimal-home nav-icons setupwizard-nag-skip teal-skin teal-wallpaper themed-icons"

# clean is bare on purpose: stock LineageOS plus the UI and behaviour options above, no
# third-party apps. libre is the no-Google daily driver -- clean plus F-Droid and Firefox, so
# there is a way to install things without GApps.
# oem is deliberately NOT in any preset: the reclaimed manufacturer assets are a separate
# choice from what apps an image carries. Add them to whichever preset you are building with
# EXTRA_OPTIONS=oem, or once in device.conf.local. The build tag gains -oem automatically, so
# an image holding OEM art can never be mistaken for the shareable one.
PRESETS="
  full    tag=turbo         options=gapps,fulguris,fdroid,k9,termoneplus,kdeconnect,connectbot
  clean   tag=turbo-clean   options=
  libre   tag=turbo-libre   options=fdroid,fulguris,k9,termoneplus,kdeconnect,connectbot
"

# Cross-device on purpose, same as bonito-22.2: STOCK_ROM_GLOB points at the *Robin* stock ROM, so
# this puts the Nextbit boot animation and sounds on a Pixel. Needs your own copy of that zip in the
# repo root; the oem option refuses to build rather than shipping an image tagged as having assets
# it does not have.
OEM_ASSET_PACK=nextbit-robin
STOCK_ROM_GLOB="Ether_Stock_ROM_*.zip"   # cross-device on purpose: Robin OEM assets on bonito
WITH_LINUX_CGROUP_PATCH=true    # proven fine: the 09-08 build that booted had it applied

# No recovery partition: recovery lives in boot.img and the zip writes it, so release.sh publishes
# only the zip.
RELEASE_NO_RECOVERY=1
